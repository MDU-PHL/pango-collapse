[tool.poetry]
name = "pango-collapse"
version = "0.8.3"
description = "Collapse Pango sublineages up to user defined parent lineages."
authors = ["wytamma <wytamma.wirth@me.com>"]
readme = "README.md"

[tool.poetry.scripts]
pango-collapse = "pango_collapse.main:app"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
typer = "^0.27.0"
pango-aliasor = "^0.3.0"
pandas = "^3.0.5"
numpy = "^2.5.1"
click = "^8.0"
rich = "^15.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"
black = "^22.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
